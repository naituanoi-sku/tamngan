function loadAll(){

    q(sb.from("tasks").select("*").eq("user_id",S.uid).or("done.eq.false,done_at.gte."+addDays(t0,-1))),
    q(sb.from("routines").select("*").eq("user_id",S.uid).order("sort")),

    S.rdone={};r[2].forEach(function(c){S.rdone[c.day+"|"+c.routine_id]=true});

/* ---------- จัดกอง ---------- */
function classify(list,t0){
  var g={rec:[],today:[],wait:[],next:[],done:[]};
  list.forEach(function(t){
    if(t.done){if(t.doneAt===t0)g.done.push(t);return}
    if(t.wait){g.wait.push(t);return}
    if(t.urgent||(t.due&&t.due<t0))g.rec.push(t);
    else if(t.due===t0)g.today.push(t);
    else g.next.push(t);
  });
  var byDue=function(a,b){return (a.due||"9").localeCompare(b.due||"9")};
  g.rec.sort(byDue);g.next.sort(byDue);g.wait.sort(function(a,b){return a.wait.since.localeCompare(b.wait.since)});
  return g;
}

/* ---------- แจ้งเตือนบนมือถือ (Web Push) ---------- */
function u8(b){b=b.replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";var s=atob(b),o=new Uint8Array(s.length);for(var i=0;i<s.length;i++)o[i]=s.charCodeAt(i);return o}
function pushSupported(){return "serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window}
function savePush(sub){var j=sub.toJSON();return q(sb.from("push_subs").upsert({endpoint:j.endpoint,user_id:S.uid,p256dh:j.keys.p256dh,auth:j.keys.auth}))}
function pushInit(){
  var b=$("pushBtn");if(!pushSupported()){b.hidden=true;return}
  navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription()}).then(function(sub){
    if(sub&&Notification.permission==="granted"){b.hidden=true;savePush(sub).catch(function(){})}else b.hidden=false;
  }).catch(function(){b.hidden=true});
}
function pushOn(){
  var b=$("pushBtn");b.disabled=true;
  Notification.requestPermission().then(function(p){
    if(p!=="granted")throw {message:"denied"};
    return q(sb.rpc("push_public_key"));
  }).then(function(key){
    if(!key)throw {message:"nokey"};
    return navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(key)})});
  }).then(function(sub){return savePush(sub)}).then(function(){
    b.hidden=true;toast("เปิดแจ้งเตือนแล้ว กำลังส่งทดสอบ…");return q(sb.rpc("push_test"));
  }).catch(function(e){var m=e&&e.message;
    toast(m==="denied"?"ไม่ได้อนุญาตแจ้งเตือน เปิดได้ที่ ตั้งค่า › การแจ้งเตือน":m==="nokey"?"ระบบแจ้งเตือนยังไม่พร้อม ลองใหม่ภายหลัง":errText(e));
  }).then(function(){b.disabled=false});
}

/* ---------- ล็อกอิน ---------- */
function showLogin(msg){
  $("app").hidden=true;$("login").hidden=false;$("lMsg").textContent=msg||"";
}
function doAuth(mode){
  var em=$("lEmail").value.trim().toLowerCase(),pw=$("lPass").value;
  if(!em||!pw){$("lMsg").textContent="ใส่อีเมลและรหัสผ่าน";return}
  var b1=$("lIn"),b2=$("lUp");b1.disabled=b2.disabled=true;$("lMsg").textContent="กำลังเชื่อมต่อ…";
  var job=mode==="up"?sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}}):sb.auth.signInWithPassword({email:em,password:pw});
  job.then(function(r){
    if(r.error)throw r.error;
    if(mode==="up"&&!r.data.session){$("lMsg").textContent="สมัครแล้ว เปิดอีเมล "+em+" แล้วกดลิงก์ยืนยัน จากนั้นกลับมากด เข้าสู่ระบบ";return}
    return start(r.data.session);
  }).catch(function(e){$("lMsg").textContent=errText(e)}).then(function(){b1.disabled=b2.disabled=false});
}
function start(session){
  S.uid=session.user.id;S.email=(session.user.email||"").toLowerCase();
  $("login").hidden=true;$("app").hidden=false;
  $("vToday").innerHTML="";$("vToday").appendChild(el("div",{class:"empty",text:"กำลังโหลดงาน…"}));
  return q(sb.rpc("is_owner")).then(function(v){S.owner=v===true},function(){S.owner=false}).then(function(){
    $("nEval").hidden=!S.owner;return loadAll()}).then(function(){render();pushInit()}).catch(function(e){toast(errText(e));render()});
}

/* ---------- เปลี่ยนหน้า ---------- */
function go(k){
  if(S.view==="eval"&&k!=="eval"&&S.dirty&&!S.discard){S.discard=true;toast("ใบประเมินยังไม่บันทึก · กดอีกครั้งเพื่อทิ้ง");return}
  if(k!=="eval"){S.dirty=false;S.discard=false}
  if(S.view==="sum"&&noteT)saveNote(S.sum.day);
  if(k==="sum"){S.sum.loaded=false;S.sum.day=today()}
  S.view=k;$("ctrs").hidden=$("ring").hidden=$("prog").hidden=k==="sum";
  [["today","nToday","vToday"],["routine","nRoutine","vRoutine"],["sum","nSum","vSum"],["eval","nEval","vEval"]].forEach(function(x){
    if(x[0]===k)$(x[1]).setAttribute("aria-current","page");else $(x[1]).removeAttribute("aria-current");$(x[2]).hidden=x[0]!==k});
  $("fab").hidden=k!=="today";render();window.scrollTo(0,0)}
function render(){renderHead();if(S.view==="today")renderToday();else if(S.view==="routine")renderRoutine();else if(S.view==="sum")renderSum();else renderEval()}

function boot(){
  $("nToday").onclick=function(){go("today")};$("nRoutine").onclick=function(){go("routine")};$("nSum").onclick=function(){go("sum")};$("nEval").onclick=function(){go("eval")};
  $("fab").onclick=function(){openTask(null)};
  $("pushBtn").onclick=pushOn;
  $("lIn").onclick=function(){doAuth("in")};$("lUp").onclick=function(){doAuth("up")};
  $("lPass").addEventListener("keydown",function(e){if(e.key==="Enter")doAuth("in")});
  $("logout").onclick=function(){if(!$("logout").dataset.arm){$("logout").dataset.arm="1";$("logout").textContent="กดอีกครั้งเพื่อออก";return}
    sb.auth.signOut().then(function(){location.reload()})};
  if(!window.supabase||!window.supabase.createClient){showLogin("โหลดระบบไม่สำเร็จ เช็คเน็ตแล้วเปิดใหม่");return}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(s)start(s);else showLogin("")});
  var lastDay=today();
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible"&&S.uid&&!$("layer").firstChild&&!S.dirty){
      if(today()!==lastDay){lastDay=today();S.evDate=today();S.ev.loadedWeek=null;S.sum.loaded=false;S.sum.day=today()}
      loadAll().then(render).catch(function(){})}});
  setInterval(function(){if(S.uid&&S.view!=="eval"&&!$("layer").firstChild&&!(document.activeElement&&document.activeElement.id==="suNote"))render()},60000);
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});
}
window.__tg={S:S,classify:classify};
boot();
})();
