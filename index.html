<style>
/* Layout: หัวสีฟ้าอ่อนมีคำทักทาย + วงความคืบหน้า + การ์ดตัวนับ 4 ใบ · ลิสต์การ์ดโค้งมนคอลัมน์เดียว · ปุ่มเพิ่มงานแบบแคปซูล · เมนูล่าง */
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1b2333; --muted:#6b7487; --line:#e5e9f1;
  --hero:#eaf1ff; --hero-ink:#21366b;
  --accent:#3466f0; --accent-soft:#e7eeff;
  --rec:#e8473a; --rec-soft:#ffecea;
  --today:#3466f0; --today-soft:#e7eeff;
  --wait:#b87900; --wait-soft:#fff3d6;
  --ok:#159a55; --ok-soft:#e1f5ea;
  --line-green:#06c755;
  --sh:0 1px 2px rgba(25,40,80,.06),0 6px 18px rgba(25,40,80,.05);
  --f-head:"Mitr","Noto Sans Thai Looped",system-ui,sans-serif;
  --f-body:"Noto Sans Thai Looped",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1320; --card:#181d2b; --ink:#e8ecf5; --muted:#98a1b5; --line:#262d3f;
  --hero:#16213d; --hero-ink:#cfdcff;
  --accent:#7d9cff; --accent-soft:#1f2b4d; --today:#7d9cff; --today-soft:#1f2b4d;
  --rec:#ff7466; --rec-soft:#3b1f1f; --wait:#f2bf4d; --wait-soft:#362a10;
  --ok:#4fd18b; --ok-soft:#12301f; --sh:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1320; --card:#181d2b; --ink:#e8ecf5; --muted:#98a1b5; --line:#262d3f;
  --hero:#16213d; --hero-ink:#cfdcff;
  --accent:#7d9cff; --accent-soft:#1f2b4d; --today:#7d9cff; --today-soft:#1f2b4d;
  --rec:#ff7466; --rec-soft:#3b1f1f; --wait:#f2bf4d; --wait-soft:#362a10;
  --ok:#4fd18b; --ok-soft:#12301f; --sh:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:560px;margin:0 auto}

/* ---- หัว ---- */
.top{background:var(--hero);color:var(--hero-ink);padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:14px;border-radius:0 0 28px 28px}
.bar{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.75}
.ver{font-weight:600;letter-spacing:.02em}
.demo{margin-left:auto;background:var(--card);color:var(--muted);border-radius:999px;padding:2px 10px;opacity:1}
.hi{display:flex;align-items:center;gap:14px;margin:8px 0 12px}
.hi .tx{flex:1;min-width:0}
.hi small{display:block;font-size:14px;opacity:.8}
.hi h1{font-family:var(--f-head);font-weight:500;font-size:26px;line-height:1.25;margin:2px 0 0}
.ring{flex:none;width:60px;height:60px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.1;color:var(--muted)}
.ring .t b{display:block;font-family:var(--f-head);font-weight:500;font-size:17px;color:var(--hero-ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{background:var(--card);border-radius:14px;padding:8px 9px;box-shadow:var(--sh);display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:6px;row-gap:1px}
.st span{grid-column:1 / -1}
.st i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-style:normal}
.st i svg{width:13px;height:13px}
.st b{font-family:var(--f-head);font-weight:500;font-size:21px;line-height:1;color:var(--ink)}
.st span{font-size:12px;color:var(--muted);font-weight:500}
.st.rec i{background:var(--rec-soft);color:var(--rec)} .st.rec b{color:var(--rec)}
.st.today i{background:var(--today-soft);color:var(--today)}
.st.wait i{background:var(--wait-soft);color:var(--wait)}
.st.done i{background:var(--ok-soft);color:var(--ok)}
.rline{margin-top:10px;display:flex;align-items:center;gap:10px;font-size:13px}
.rline .track{flex:1;height:7px;background:var(--card);border-radius:7px;overflow:hidden}
.rline .fill{height:100%;background:var(--ok);border-radius:7px;transition:width .3s}

/* ---- เนื้อหา ---- */
main{padding-top:18px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.sec{margin-top:22px}
.sec:first-child{margin-top:0}
.sh{display:flex;align-items:center;gap:8px;margin:0 4px 10px;font-family:var(--f-head);font-weight:500;font-size:16px}
.sh .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.sh .n{font-family:var(--f-body);font-size:12px;font-weight:600;background:var(--card);color:var(--muted);border-radius:999px;padding:1px 9px;box-shadow:var(--sh)}
.sh.rec{color:var(--rec)} .sh.rec .dot{background:var(--rec)}
.sh.today .dot{background:var(--today)}
.sh.wait{color:var(--wait)} .sh.wait .dot{background:var(--wait)}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:18px;padding:14px 12px 14px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--sh);cursor:pointer}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #c3c9d6;display:grid;place-items:center;margin-top:1px;transition:background .15s}
.card.rec .tick{border-color:var(--rec)}
.card.wait .tick{border-color:var(--wait)}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tick svg{width:14px;height:14px}
.cb{flex:1;min-width:0}
.ttl{font-weight:500;overflow-wrap:anywhere}
.done .ttl{color:var(--muted);text-decoration:line-through}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12.5px;border-radius:8px;padding:2px 9px;background:var(--bg);color:var(--muted);font-weight:500}
.tag.rec{background:var(--rec-soft);color:var(--rec);font-weight:600}
.tag.wait{background:var(--wait-soft);color:var(--wait);font-weight:600}
.lk{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 12px 6px 8px;border-radius:999px;font-size:13.5px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.lk.line{background:var(--line-green);color:#fff}
.lk svg{width:18px;height:18px}
.thumbs{display:flex;gap:6px;margin-top:8px}
.thumbs img{width:60px;height:60px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.more{flex:none;color:var(--muted);width:30px;height:30px;display:grid;place-items:center;border-radius:10px;margin:-4px -4px 0 0}
.more svg{width:18px;height:18px}
.empty{color:var(--muted);font-size:14px;padding:18px 14px;background:var(--card);border-radius:18px;text-align:center;box-shadow:var(--sh)}
details.fold>summary{list-style:none;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .sh::after{content:"แสดง";margin-left:auto;font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--accent)}
details.fold[open]>summary .sh::after{content:"ซ่อน"}

/* ---- ประจำวัน ---- */
.rt{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--sh)}
.rrow{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .time{font-size:12.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:8px;padding:2px 8px}
.rrow .time.now{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rrow .tt{flex:1;min-width:0}
.rrow.done .tt{color:var(--muted);text-decoration:line-through}
.note{font-size:13px;color:var(--muted);margin:10px 4px 0}

/* ---- ปุ่ม ---- */
.btn{border-radius:14px;padding:11px 18px;font-weight:600;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.btn.pri{background:var(--accent);color:#fff;box-shadow:none}
.btn.danger{color:var(--rec);box-shadow:inset 0 0 0 1px var(--rec-soft)}
.btn.sm{padding:7px 13px;font-size:14px;border-radius:11px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));height:52px;padding:0 20px 0 16px;border-radius:999px;background:var(--accent);color:#fff;display:flex;align-items:center;gap:6px;font-weight:600;box-shadow:0 8px 22px rgba(52,102,240,.35);z-index:6}
.fab svg{width:22px;height:22px}

/* ---- เมนูล่าง ---- */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav .in{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.nav button{padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
.nav button i{width:52px;height:30px;border-radius:999px;display:grid;place-items:center;font-style:normal}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav button[aria-current="page"] i{background:var(--accent-soft)}

/* ---- แผ่นเลื่อนขึ้น ---- */
.scrim{position:fixed;inset:0;background:rgba(15,20,35,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:92vh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(36px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font-family:var(--f-head);font-weight:500;font-size:20px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field>label,.lab{font-size:13px;font-weight:600;color:var(--muted)}
textarea,input[type=text],input[type=url],input[type=date],input[type=time]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 13px;min-width:0}
textarea{min-height:68px;resize:vertical}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;background:var(--bg)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.chip.rec[aria-pressed="true"]{background:var(--rec);color:#fff}
.chip.wait[aria-pressed="true"]{background:var(--wait);color:#fff}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative}
.ph img{width:76px;height:76px;object-fit:cover;border-radius:14px;border:1px solid var(--line);display:block}
.ph button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--card);font-size:14px;line-height:24px}
.addph{width:76px;height:76px;border-radius:14px;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;cursor:pointer}
.addph svg{width:22px;height:22px;display:block;margin:0 auto 2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:30;display:grid;place-items:center;padding:20px}
.viewer img{max-width:100%;max-height:100%;border-radius:10px}

/* ---- ประเมิน ---- */
.seg{display:flex;background:var(--card);border-radius:16px;padding:4px;gap:4px;box-shadow:var(--sh)}
.seg button{flex:1;padding:9px 6px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--card);border-radius:18px;padding:16px;margin-top:12px;box-shadow:var(--sh)}
.topic{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--line)}
.topic:first-child{border-top:0;padding-top:0}
.scale{display:flex;gap:6px}
.scale button{width:40px;height:40px;border-radius:12px;background:var(--bg);font-weight:600}
.scale button[aria-pressed="true"]{background:var(--accent);color:#fff}
.skip{font-size:12px;color:var(--muted)}
.pf{display:flex;gap:8px}
.pf button{flex:1;padding:12px;border-radius:14px;font-weight:700;background:var(--bg)}
.pf .p[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.pf .f[aria-pressed="true"]{background:var(--rec-soft);color:var(--rec);box-shadow:inset 0 0 0 1.5px var(--rec)}
.tw{overflow-x:auto;background:var(--card);border-radius:18px;margin-top:12px;box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left;font-weight:600}
td .c{font-size:11px;color:var(--muted)}
.daynav{display:flex;align-items:center;gap:8px}
.daynav .dn{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.daynav .btn:disabled{opacity:.35}
.tag.link{background:var(--accent-soft);color:var(--accent);font-weight:600;cursor:pointer}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.wk button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:12px;background:var(--bg);font-size:11px;color:var(--muted)}
.wk button b{font-size:16px;color:var(--ink);font-weight:600}
.wk button i{width:5px;height:5px;border-radius:50%;background:transparent}
.wk button i.on{background:var(--ok)}
.wk button.is-today b{color:var(--accent)}
.wk button[aria-pressed="true"]{background:var(--accent);color:#fff}
.wk button[aria-pressed="true"] b{color:#fff}
.wk button[aria-pressed="true"] i.on{background:#fff}
.wk button:disabled{opacity:.35}
.ecard{background:var(--card);border-radius:18px;padding:13px 14px;margin-top:10px;box-shadow:var(--sh)}
.ecard.scored{box-shadow:inset 3px 0 0 var(--accent),var(--sh)}
.eh{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
.en{font-weight:600;flex:1 1 150px;min-width:0}
.det{margin-top:10px;min-height:0;resize:none;overflow:hidden;font-size:14.5px;padding:9px 12px}
.avg{display:grid;grid-template-columns:1fr 70px 62px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.avg:nth-child(2){border-top:0}
.an{font-size:14px;min-width:0}
.ab{height:7px;background:var(--bg);border-radius:7px;overflow:hidden}
.ab i{display:block;height:100%;background:var(--accent);border-radius:7px}

    el("button",{class:"btn sm","aria-label":"สัปดาห์ถัดไป",text:"›",onclick:function(){S.evDate=addDays(S.evDate,7);renderEval()}})]));
  var mine=Object.keys(S.ev.days).map(function(k){return S.ev.days[k]}).filter(function(d){return d.date>=ws&&d.date<=we&&d.intern===S.evIntern}).sort(function(a,b){return a.date.localeCompare(b.date)});
  var pass=mine.filter(function(d){return d.pass===true}).length,fail=mine.filter(function(d){return d.pass===false}).length;
  v.appendChild(el("div",{class:"stats",style:"grid-template-columns:repeat(3,1fr);margin-top:12px"},[
    el("div",{class:"st today"},[el("b",{text:String(mine.length)}),el("span",{text:"วันที่ประเมิน"})]),
    el("div",{class:"st done"},[el("b",{style:"color:var(--ok)",text:String(pass)}),el("span",{text:"ผ่าน"})]),
    el("div",{class:"st rec"},[el("b",{text:String(fail)}),el("span",{text:"ไม่ผ่าน"})])]));
  var p=el("div",{class:"panel"},[el("div",{class:"lab",style:"margin-bottom:6px",text:"ค่าเฉลี่ยต่อหัวข้อ (วงเล็บ = จำนวนวันที่ให้คะแนน)"})]);
  S.ev.topics.forEach(function(t){var xs=mine.map(function(d){return d.scores[t.id]}).filter(function(x){return typeof x==="number"});
    if(t.hidden&&!xs.length)return;
    var avg=xs.length?xs.reduce(function(a,b){return a+b},0)/xs.length:null;
    p.appendChild(el("div",{class:"avg","data-topic":t.id},[el("div",{class:"an",text:t.name}),
      el("div",{class:"ab"},[el("i",{style:"width:"+(avg?avg/5*100:0)+"%"})]),
      el("div",{class:"av"},avg==null?["–"]:[avg.toFixed(1)," ",el("span",{class:"c",text:"("+xs.length+")"})])]));
  });
  v.appendChild(p);
  var list=el("div",{style:"margin-top:16px"},[el("div",{class:"sh today"},[el("span",{class:"dot"}),"รายวัน",el("span",{class:"n",text:String(mine.length)})])]);
  if(!mine.length)list.appendChild(el("div",{class:"empty",text:"สัปดาห์นี้ยังไม่มีใบประเมิน"}));
  mine.slice().reverse().forEach(function(d){
    var notes=S.ev.topics.filter(function(t){return d.notes&&d.notes[t.id]}).map(function(t){return el("div",{class:"dl"},[el("b",{text:t.name+(d.scores[t.id]!=null?" · "+d.scores[t.id]:"")}),el("span",{text:d.notes[t.id]})])});
    list.appendChild(el("div",{class:"panel dayc"},[
      el("div",{class:"row"},[el("b",{class:"grow",text:fmtL(d.date)}),
        d.pass===true?el("span",{class:"tag",style:"background:var(--ok-soft);color:var(--ok)",text:"ผ่าน"}):d.pass===false?el("span",{class:"tag rec",text:"ไม่ผ่าน"}):el("span",{class:"tag",text:"ไม่ระบุผล"}),
        el("button",{class:"btn sm",text:"เปิดใบ",onclick:function(){S.evDate=d.date;S.evIntern=d.intern;S.evTab="form";loadForm();renderEval()}})]),
      el("div",{class:"note",style:"margin:6px 0 0",text:"ให้คะแนน "+Object.keys(d.scores).length+"/"+topicsOn().length+" หัวข้อ"}),
      d.note?el("div",{class:"dl"},[el("b",{text:"ภาพรวม"}),el("span",{text:d.note})]):null].concat(notes)));
  });
  v.appendChild(list);
}
function evSet(v){
  [["eval_interns","interns","ชื่อน้องฝึกงาน","เพิ่มชื่อน้อง"],["eval_topics","topics","หัวข้อประเมิน","เพิ่มหัวข้อ"]].forEach(function(x){
    var tbl=x[0],key=x[1];
    var p=el("div",{class:"panel"},[el("div",{class:"lab",style:"margin-bottom:8px",text:x[2]})]);
    S.ev[key].forEach(function(it){
      var inp=el("input",{type:"text",value:it.name,style:it.hidden?"color:var(--muted);text-decoration:line-through":null});
      inp.onchange=function(){var nv=inp.value.trim();if(!nv||nv===it.name){inp.value=it.name;return}
        q(sb.from(tbl).update({name:nv}).eq("id",it.id)).then(function(){it.name=nv;toast("แก้ชื่อแล้ว")}).catch(function(e){inp.value=it.name;toast(errText(e))})};
      p.appendChild(el("div",{class:"row",style:"margin-bottom:8px"},[el("div",{class:"grow"},[inp]),
        el("button",{class:"btn sm",text:it.hidden?"แสดง":"ซ่อน",onclick:function(){
          q(sb.from(tbl).update({hidden:!it.hidden}).eq("id",it.id)).then(function(){it.hidden=!it.hidden;if(key==="interns"&&it.hidden&&S.evIntern===it.id)S.evIntern=null;renderEval()}).catch(function(e){toast(errText(e))})}})]));
    });
    var add=el("input",{type:"text",placeholder:x[3]});
    var ab=el("button",{class:"btn sm pri",text:"เพิ่ม",onclick:function(){var nv=add.value.trim();if(!nv)return;ab.disabled=true;
      var row={id:uuid(),name:nv,hidden:false,sort:S.ev[key].length+1};
      q(sb.from(tbl).insert(row)).then(function(){S.ev[key].push(row);renderEval()}).catch(function(e){ab.disabled=false;toast(errText(e))})}});
    p.appendChild(el("div",{class:"row"},[el("div",{class:"grow"},[add]),ab]));
    v.appendChild(p);
  });
  v.appendChild(el("div",{class:"note",text:"ซ่อน = ไม่โชว์ในใบใหม่ แต่คะแนนเก่ายังอยู่ครบ"}));
}

/* ---------- ล็อกอิน ---------- */
function showLogin(msg){
  $("app").hidden=true;$("login").hidden=false;$("lMsg").textContent=msg||"";
}
function doAuth(mode){
  var em=$("lEmail").value.trim().toLowerCase(),pw=$("lPass").value;
  if(!em||!pw){$("lMsg").textContent="ใส่อีเมลและรหัสผ่าน";return}
  var b1=$("lIn"),b2=$("lUp");b1.disabled=b2.disabled=true;$("lMsg").textContent="กำลังเชื่อมต่อ…";
  var job=mode==="up"?sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}}):sb.auth.signInWithPassword({email:em,password:pw});
  job.then(function(r){
    if(r.error)throw r.error;
    if(mode==="up"&&!r.data.session){$("lMsg").textContent="สมัครแล้ว เปิดอีเมล "+em+" แล้วกดลิงก์ยืนยัน จากนั้นกลับมากด เข้าสู่ระบบ";return}
    return start(r.data.session);
  }).catch(function(e){$("lMsg").textContent=errText(e)}).then(function(){b1.disabled=b2.disabled=false});
}
function start(session){
  S.uid=session.user.id;S.email=(session.user.email||"").toLowerCase();
  $("login").hidden=true;$("app").hidden=false;
  $("vToday").innerHTML="";$("vToday").appendChild(el("div",{class:"empty",text:"กำลังโหลดงาน…"}));
  return q(sb.rpc("is_owner")).then(function(v){S.owner=v===true},function(){S.owner=false}).then(function(){
    $("nEval").hidden=!S.owner;return loadAll()}).then(function(){render()}).catch(function(e){toast(errText(e));render()});
}

/* ---------- เปลี่ยนหน้า ---------- */
function go(k){
  if(S.view==="eval"&&k!=="eval"&&S.dirty&&!S.discard){S.discard=true;toast("ใบประเมินยังไม่บันทึก · กดอีกครั้งเพื่อทิ้ง");return}
  if(k!=="eval"){S.dirty=false;S.discard=false}
  S.view=k;
  [["today","nToday","vToday"],["routine","nRoutine","vRoutine"],["eval","nEval","vEval"]].forEach(function(x){
    if(x[0]===k)$(x[1]).setAttribute("aria-current","page");else $(x[1]).removeAttribute("aria-current");$(x[2]).hidden=x[0]!==k});
  $("fab").hidden=k!=="today";render();window.scrollTo(0,0)}
function render(){renderHead();if(S.view==="today")renderToday();else if(S.view==="routine")renderRoutine();else renderEval()}

function boot(){
  $("nToday").onclick=function(){go("today")};$("nRoutine").onclick=function(){go("routine")};$("nEval").onclick=function(){go("eval")};
  $("fab").onclick=function(){openTask(null)};
  $("lIn").onclick=function(){doAuth("in")};$("lUp").onclick=function(){doAuth("up")};
  $("lPass").addEventListener("keydown",function(e){if(e.key==="Enter")doAuth("in")});
  $("logout").onclick=function(){if(!$("logout").dataset.arm){$("logout").dataset.arm="1";$("logout").textContent="กดอีกครั้งเพื่อออก";return}
    sb.auth.signOut().then(function(){location.reload()})};
  if(!window.supabase||!window.supabase.createClient){showLogin("โหลดระบบไม่สำเร็จ เช็คเน็ตแล้วเปิดใหม่");return}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(s)start(s);else showLogin("")});
  var lastDay=today();
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible"&&S.uid&&!$("layer").firstChild&&!S.dirty){
      if(today()!==lastDay){lastDay=today();S.evDate=today();S.ev.loadedWeek=null}
      loadAll().then(render).catch(function(){})}});
  setInterval(function(){if(S.uid&&S.view!=="eval"&&!$("layer").firstChild)render()},60000);
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});
}
window.__tg={S:S,classify:classify};
boot();
})();
</script>
